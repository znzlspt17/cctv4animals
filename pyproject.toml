[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mysql: MySQL backend tests",
    "redis: Redis backend tests",
    "slow: slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["server"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
