[project]
name = "deepface-live"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=16.1.0",
    "deepface>=0.0.99",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.135.3",
    "jupyter>=1.1.1",
    "numpy>=2.4.4",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.24",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.56.0",
    "streamlit-drawable-canvas>=0.9.3",
    "streamlit-webrtc>=0.64.5",
    "supervision>=0.27.0.post2",
    "tf-keras>=2.21.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.33",
    "uvicorn[standard]>=0.43.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
